<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Portfolio{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <script defer src="{% static 'js/theme.js' %}"></script>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">YourName<span class="muted">.security</span></a>

      <nav class="nav">
        <a href="/projects/">Projects</a>
        <a href="/projects/documents/">Documents</a>
        <a href="/projects/certifications/">Certifications</a>
        <a href="/blog/">Blog</a>
        <a href="/contact/">Contact</a>
        <button class="btn btn-ghost" id="themeToggle" type="button" aria-label="Toggle theme">
          Theme
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <small class="muted">© {% now 'Y' %} YourName. Built for speed, accessibility, and security.</small>
    </div>
  </footer>
</body>
</html>
